name: DevOps GenAI Lab CI

on:
  pull_request:
    paths:
      - "devops_lab/**"
      - ".github/workflows/devops-lab-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest==8.3.5
      - name: Run intentional failure test
        shell: bash
        run: |
          set +e
          python -m pytest -q devops_lab/tests/test_shipping_service.py > test-output.log 2>&1
          test_status=$?
          cat test-output.log
          exit "$test_status"
      - name: Save test output for analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devops-lab-test-output
          path: test-output.log
          retention-days: 1