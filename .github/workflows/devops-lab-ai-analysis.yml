name: DevOps GenAI Lab Failure Analysis

on:
  workflow_run:
    workflows: ["DevOps GenAI Lab CI"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  analyze-failure:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Groq-compatible OpenAI SDK
        run: python -m pip install openai==1.90.0
      - name: Download test log artifact
        uses: actions/download-artifact@v4
        with:
          name: devops-lab-test-output
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Analyze failure and comment on pull request
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python devops_lab/analyze_failure.py test-output.log